<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1824">
  <title>Monster Arena</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1824; color: #f4ead5; font-family: system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #1b1824; z-index: 2; text-align: center; }
    .card { width: min(100%, 480px); }
    h1 { color: #e8c170; font-size: clamp(24px, 5vw, 40px); letter-spacing: .06em; }
    p { line-height: 1.5; }
    progress { display: block; width: 100%; height: 18px; margin: 24px 0; accent-color: #e8c170; }
    button { min-width: 120px; min-height: 48px; padding: 10px 20px; border: 2px solid #e8c170; background: #3b2f4a; color: #f4ead5; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #details { overflow-wrap: anywhere; font-size: 14px; color: #c8bbd4; }
    [hidden] { display: none !important; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Monster Arena game">Your browser needs canvas support.</canvas>
  <div id="loading" class="overlay" role="status" aria-live="polite">
    <div class="card">
      <h1>MONSTER ARENA</h1>
      <p id="message">Loading the arena…</p>
      <progress id="progress" aria-label="Game download"></progress>
      <p id="details">First load can take a moment. Keep this page open.</p>
      <button id="retry" hidden>Retry</button>
    </div>
  </div>
  <div id="context-error" class="overlay" role="alert" hidden>
    <div class="card"><h1>Graphics interrupted</h1><p>The browser stopped the graphics session. Reload to return to the arena. The current battle will be lost; completed battles remain saved.</p><button onclick="location.reload()">Reload</button></div>
  </div>
  <noscript><div class="overlay">Enable JavaScript to play Monster Arena.</div></noscript>
  <script>
    // Set up lifecycle before downloading the engine so a hidden startup is safe.
    window.monsterArena = {
      mobile: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
      hidden: document.hidden,
      onVisibility: null
    };
    function publishVisibility(hidden) {
      monsterArena.hidden = hidden;
      if (monsterArena.onVisibility) monsterArena.onVisibility(hidden);
    }
    document.addEventListener('visibilitychange', () => publishVisibility(document.hidden));
    window.addEventListener('pagehide', () => publishVisibility(true));
    window.addEventListener('pageshow', () => publishVisibility(document.hidden));

    const canvas = document.getElementById('canvas');
    function resizeCanvas() {
      // Bound Retina fill rate and render-buffer memory. CSS/touch/safe areas stay in CSS px.
      const ratio = Math.min(window.devicePixelRatio || 1, monsterArena.mobile ? 1.5 : 2);
      canvas.width = Math.max(1, Math.round(window.innerWidth * ratio));
      canvas.height = Math.max(1, Math.round(window.innerHeight * ratio));
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('webglcontextlost', (event) => {
      event.preventDefault();
      publishVisibility(true);
      document.getElementById('context-error').hidden = false;
    });

    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const details = document.getElementById('details');
    const progress = document.getElementById('progress');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => location.reload());
    function showFailure(error) {
      loading.hidden = false;
      message.textContent = 'The arena could not start';
      details.textContent = String(error && error.message || error) + ' — Check your connection and use a browser with WebGL 2 support, then retry.';
      progress.hidden = true;
      retry.hidden = false;
    }
  </script>
  <script src="index.js" onerror="showFailure('Engine download failed')"></script>
  <script>
    if (typeof Engine !== 'undefined') {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3421672,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
      const missing = Engine.getMissingFeatures({ threads: false });
      if (missing.length) {
        showFailure('Missing browser features: ' + missing.join(', '));
      } else {
        const engine = new Engine(config);
        engine.startGame({
          canvas: canvas,
          canvasResizePolicy: 0,
          onProgress(current, total) {
            if (current > 0 && total > 0) {
              progress.max = total;
              progress.value = current;
              message.textContent = current < total ? 'Loading the arena… ' + Math.floor(current / total * 100) + '%' : 'Preparing monsters…';
            } else {
              progress.removeAttribute('value');
              message.textContent = 'Preparing the arena…';
            }
          }
        }).then(() => { loading.hidden = true; resizeCanvas(); }, showFailure);
      }
    }
  </script>
</body>
</html>
